services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - saleor-media:/srv/media:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - dashboard
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: ghcr.io/saleor/saleor:3.20
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/entrypoint-wrapper.sh"]
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "4", "--worker-class", "uvicorn.workers.UvicornWorker", "saleor.asgi:application"]
    expose:
      - "8000"
    env_file:
      - .env.api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - saleor-media:/app/media
      - ./rsa_private.pem:/run/secrets/rsa.pem:ro
      - ./entrypoint.sh:/app/entrypoint-wrapper.sh:ro
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.5'
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    image: ghcr.io/saleor/saleor:3.20
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/entrypoint-wrapper.sh"]
    command: ["celery", "--app", "saleor.celeryconf:app", "worker", "-E", "--loglevel=info"]
    env_file:
      - .env.api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - saleor-media:/app/media
      - ./rsa_private.pem:/run/secrets/rsa.pem:ro
      - ./entrypoint.sh:/app/entrypoint-wrapper.sh:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  beat:
    image: ghcr.io/saleor/saleor:3.20
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/entrypoint-wrapper.sh"]
    command: ["celery", "--app", "saleor.celeryconf:app", "beat", "--scheduler", "saleor.schedulers.schedulers.DatabaseScheduler"]
    env_file:
      - .env.api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./rsa_private.pem:/run/secrets/rsa.pem:ro
      - ./entrypoint.sh:/app/entrypoint-wrapper.sh:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.20
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - API_URL=https://api.edelbrandfreunde.at/graphql/
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=saleor
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=saleor
    volumes:
      - saleor-db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - saleor-redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping 2>/dev/null | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postfix:
    # Pinned to a specific version. Update deliberately:
    # 1) bump the tag, 2) docker compose pull postfix, 3) docker compose up -d postfix
    # Available tags: https://hub.docker.com/r/boky/postfix/tags
    image: boky/postfix:5.1.0
    restart: unless-stopped
    environment:
      - ALLOWED_SENDER_DOMAINS=edelbrandfreunde.at
      - DKIM_AUTOGENERATE=0
      - DKIM_SELECTOR=mail
      - POSTFIX_myhostname=mail.edelbrandfreunde.at
      - POSTFIX_smtp_tls_security_level=may
      - POSTFIX_smtp_tls_mandatory_protocols=>=TLSv1.2
      - POSTFIX_smtp_tls_protocols=>=TLSv1.2
      - POSTFIX_smtpd_relay_restrictions=permit_mynetworks,reject_unauth_destination
      - POSTFIX_mynetworks=172.18.0.0/24 [::1]/128
      - POSTFIX_message_size_limit=10240000
      - POSTFIX_smtpd_client_connection_rate_limit=30
      - POSTFIX_smtpd_client_message_rate_limit=60
      - POSTFIX_smtpd_client_recipient_rate_limit=120
      - POSTFIX_header_size_limit=51200
      - POSTFIX_maximal_queue_lifetime=1d
      - POSTFIX_bounce_queue_lifetime=1d
    volumes:
      - ./postfix-data/dkim:/etc/opendkim/keys
    expose:
      - "587"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Bind to <1024 for SMTP submission (587)
      - NET_BIND_SERVICE
      # Postfix master forks workers under specific UIDs/GIDs
      - SETUID
      - SETGID
      # Read/write spool dirs across postfix:postdrop ownership boundary
      - DAC_OVERRIDE
      # Init script chowns /var/spool/postfix and /var/run/opendkim to postfix user.
      # Without this, OpenDKIM startup fails fatally on container recreate.
      - CHOWN
      # Modify timestamps/attributes on chroot dirs the container itself owns
      - FOWNER
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  saleor-db:
  saleor-redis:
  saleor-media:
  caddy_data:
  caddy_config:

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    driver: bridge
